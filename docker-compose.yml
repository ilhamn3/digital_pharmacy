services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmacy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pharmacy_pos}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pharmacy_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pharmacy_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pharmacy_pos}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-pharmacy_dev_access_secret_key_minimum_32_characters_long_for_security}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-pharmacy_dev_refresh_secret_key_minimum_32_characters_long_for_security}
      CLIENT_URL: http://localhost:3000
      TIMEZONE: Asia/Colombo
      CURRENCY: LKR
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pharmacy_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:

